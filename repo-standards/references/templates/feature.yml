name: Feature request
description: A problem the project does not solve yet
labels: [enhancement]
body:
  - type: checkboxes
    id: searched
    attributes:
      label: Search first
      options:
        - label: I searched open and closed issues and found no request like this one
          required: true
  - type: textarea
    id: problem
    attributes:
      label: What problem do you have, and who has it?
      description: Describe the situation, not the solution. Say what you do today instead.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: What do you propose?
      description: The change you have in mind, and how you would use it.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: What else did you consider?
      description: Other approaches or workarounds, and why they fall short.
    validations:
      required: false
