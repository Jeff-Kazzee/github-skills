# Installed by the repo-standards skill. review-gate reads the run of the workflow named
# "ci" on the exact head, so keep this name. The standards gates live in skills-check.yml.
name: ci

on:
  pull_request:
  push:
    branches: [dev, prod]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      # Replace with the repo's own test command when it has one.
      - run: node --test
